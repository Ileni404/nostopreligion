
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valo Merch Store</title>
    
    <!-- 1. CSS di Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- 2. Il tuo CSS personalizzato (va sotto Bootstrap così puoi sovrascrivere gli stili) -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">
    <!-- Video di Sfondo in Loop -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="video_bg_html_valo.mp4" type="video/mp4">
    </video>

    <!-- Header con Navbar di Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black px-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-danger logo" href="#">ValoB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#prodotti">Prodotti</a></li>
                    <li class="nav-item"><a class="nav-link" href="#chi-siamo">Chi Siamo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Banner Principale (Hero) -->
    <section class="hero text-center py-5 my-4">
        <h1 class="display-4 fw-bold">Scegli il tuo stile</h1>
        <p class="lead text-secondary">Le migliori magliette e merch d'impatto.</p>
        <a href="#prodotti" class="btn btn-danger btn-lg mt-2">Sfoglia il Catalogo</a>
    </section>

    <!-- Sezione Catalogo Prodotti con Griglia Bootstrap -->
    <section id="prodotti" class="container my-5">
        <h2 class="text-center mb-4">Prodotti in Evidenza</h2>
        
        <div class="row g-4 justify-content-center">
            
            <!-- Scheda Maglietta 1 -->
            <div class="col-12 col-md-4">
                <div class="card bg-secondary text-white border-0 h-100 product-card">
                    <div class="bg-dark text-secondary d-flex align-items-center justify-content-center img-placeholder" style="height: 220px;">
                        Foto Maglietta 1
                    </div>
                    <div class="card-body text-center">
                        <h3 class="card-title h5">T-Shirt Classic</h3>
                        <p class="card-text text-warning fw-bold fs-5">€24.99</p>
                        <button class="btn btn-outline-light w-100 buy-btn">Acquista</button>
                    </div>
                </div>
            </div>

            <!-- Scheda Maglietta 2 -->
            <div class="col-12 col-md-4">
                <div class="card bg-secondary text-white border-0 h-100 product-card">
                    <div class="bg-dark text-secondary d-flex align-items-center justify-content-center img-placeholder" style="height: 220px;">
                        Foto Maglietta 2
                    </div>
                    <div class="card-body text-center">
                        <h3 class="card-title h5">T-Shirt Limited Edition</h3>
                        <p class="card-text text-warning fw-bold fs-5">€29.99</p>
                        <button class="btn btn-outline-light w-100 buy-btn">Acquista</button>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- JavaScript di Bootstrap (per far funzionare il menu da mobile) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
