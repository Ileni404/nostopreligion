<!<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valo Merch Store</title>
    
    <!-- 1. CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- 2. CSS Personalizzato -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white">

    <!-- Video di Sfondo -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="video_bg_html_valo.mp4" type="video/mp4">
    </video>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black px-4 sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand font-logo fs-2 text-white" href="#">ValoB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#prodotti">sfoglia</a></li>
                    <li class="nav-item"><a class="nav-link" href="#chi-siamo">contattaci</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section / Logo Principale -->
    <section class="logo-container text-center py-4">
        <h1 class="logo-main font-logo">VALO.B</h1>
        <p class="logo-sub font-text italic">swag olbiese certificato.</p>
    </section>

    <!-- Catalogo Prodotti Dinamico -->
    <section id="prodotti" class="container my-5">
        <div class="row g-4 justify-content-center" id="catalog"></div>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
