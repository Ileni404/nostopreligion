<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValoB — Official Website</title>
    
    <!-- CSS Esterni -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black px-4 sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand font-logo fs-2 text-white" href="#">ValoB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#musica">Musica</a></li>
                    <li class="nav-item"><a class="nav-link" href="#merch">Merch</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contatti">Contatti</a></li>
                    <li class="nav-item d-flex ms-lg-3 gap-3 social-list mt-3 mt-lg-0"></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="logo-container text-center py-5">
        <h1 class="logo-main font-logo display-1">VALO.B</h1>
        <p class="logo-sub font-text italic">swag olbiese certificato.</p>
        <div class="mt-4">
            <a href="#musica" class="btn btn-outline-light rounded-0 font-text me-2">Ascolta la Musica</a>
            <a href="#merch" class="btn btn-light rounded-0 font-text">Guarda il Merch</a>
        </div>
    </section>

    <!-- Musica -->
    <section id="musica" class="container my-5 py-4">
        <h2 class="font-logo text-center mb-4 display-5">Musica</h2>
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="ratio ratio-16x9 shadow-lg border border-secondary">
                    <iframe id="spotify-player" width="100%" height="352" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </section>

    <!-- Merch -->
    <section id="merch" class="container my-5 py-4">
        <h2 class="font-logo text-center mb-4 display-5">Merch</h2>
        <div class="row g-4 justify-content-center" id="merch-container"></div>
    </section>

    <!-- Footer -->
    <footer id="contatti" class="bg-black border-top border-dark py-5 text-center mt-5">
        <div class="container">
            <h3 class="font-logo mb-3">ValoB</h3>
            <p class="font-text text-secondary mb-3">For Booking & Inquiries:</p>
            <p class="font-text fs-5 mb-4"><a id="email-link" class="text-white text-decoration-none"></a></p>
            <div class="d-flex justify-content-center gap-4 mb-4 social-list fs-3"></div>
            <small class="text-secondary">&copy; 2026 ValoB. All rights reserved.</small>
        </div>
    </footer>

    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Dati & Rendering Dinamico -->
    <script>
        // CONFIGURAZIONE DATI ARTISTA
        const CONFIG = {
            email: "info@valob.com",
            spotifyEmbed: "https://open.spotify.com/embed/artist/3ESY1mpS8AIkU6O6Hc9WxI?utm_source=generator&theme=0",
            socials: [
                { icon: "fa-instagram", url: "https://www.instagram.com/nostopreligion" },
                { icon: "fa-spotify", url: "https://open.spotify.com/artist/3ESY1mpS8AIkU6O6Hc9WxI" },
                { icon: "fa-youtube", url: "https://www.youtube.com/@valotrvp" }
            ],
            merch: [
                { title: 'T-Shirt "Troppo Co"', front: 'troppoco-front.jpg', back: 'troppoco-back.jpg', link: 'https://www.instagram.com/nostopreligion' },
                { title: 'T-Shirt "No Stop"', front: 'nostop-front.jpg', back: 'nostop-back.jpg', link: 'https://www.instagram.com/nostopreligion' }
            ]
        };
        // Render Email & Spotify Player
        document.getElementById('spotify-player').src = CONFIG.spotifyEmbed;
        const mailEl = document.getElementById('email-link');
        mailEl.href = `mailto:${CONFIG.email}`;
        mailEl.textContent = CONFIG.email;

        // Render Social Media
        document.querySelectorAll('.social-list').forEach(container => {
            container.innerHTML = CONFIG.socials.map(s => 
                `<a href="${s.url}" target="_blank" class="text-white social-link"><i class="fa-brands ${s.icon}"></i></a>`
            ).join('');
        });

        // Render Prodotti Merch
        document.getElementById('merch-container').innerHTML = CONFIG.merch.map(p => `
            <div class="col-md-5 col-sm-6">
                <div class="product-card text-center h-100 p-3 border border-dark">
                    <div class="product-img-wrapper mb-3">
                        <img src="${p.front}" alt="${p.title} Fronte" class="img-fluid img-front">
                        <img src="${p.back}" alt="${p.title} Retro" class="img-fluid img-back">
                    </div>
                    <h3 class="product-title h4">${p.title}</h3>
                    <p class="font-text italic text-secondary">Passa il mouse per il retro</p>
                    <a href="${p.link}" target="_blank" class="btn btn-outline-light btn-sm rounded-0 w-100 font-text">Info & Disponibilità su IG</a>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
